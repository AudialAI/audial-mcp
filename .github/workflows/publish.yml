name: publish
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev && uv run pytest -q
      - run: uv build
      - run: uv publish --token "${{ secrets.PYPI_TOKEN }}"
