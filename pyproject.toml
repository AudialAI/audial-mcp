[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "audial-mcp"
version = "0.2.0"
description = "MCP server for Audial: stem splitting, mastering, MIDI, music generation, resynthesis and vocal synthesis from any MCP client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Audial", email = "contact@audialmusic.ai" }]
keywords = ["mcp", "audio", "music", "stems", "audial", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "mcp>=2.2,<3",
  "audial-sdk>=1.3.0",
  "anyio>=4",
  "pydantic>=2",
  "typing_extensions>=4",
]

[project.urls]
Homepage = "https://audialmusic.ai"
Documentation = "https://audialmusic.ai/resources/api-reference"
Repository = "https://github.com/AudialAI/audial-mcp"

[project.scripts]
audial-mcp = "audial_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/audial_mcp"]

# The sdist ships the package and its metadata, not the project's working notes: docs/ is
# design and checklist material, .github/ is CI, .superpowers/ is planning scratch.
[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github", ".superpowers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# `ruff format` rewrites Python code blocks inside Markdown, which reflows the illustrative
# snippets in the design and plan documents. Those are prose, not code that runs.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
